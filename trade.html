<!DOCTYPE html>
<html>
<head>
  <title>Demo Dashboard - HassanFX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #0a0a0a; color: white; font-family: Arial; padding: 20px; }
    .balance { background: #1a1a1a; padding: 20px; border-radius: 10px; text-align: center; }
    .balance h1 { color: #00ff88; font-size: 40px; margin: 10px; }
    .buttons { display: flex; gap: 10px; margin-top: 20px; }
    .buy { background: #00ff88; color: black; flex: 1; padding: 15px; border: none; border-radius: 5px; font-weight: bold; }
    .sell { background: #ff0044; color: white; flex: 1; padding: 15px; border: none; border-radius: 5px; font-weight: bold; }
    a { color: #007bff; display: block; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Welcome Hassan! Demo Account</h2>
  <div class="balance">
    <p>Virtual Balance</p>
    <h1>$10,000.00</h1>
    <p>Profit: +$0.00</p>
  </div>
  
  <h3>EUR/USD</h3>
  <p>Price: 1.0854</p>
  
  <div class="buttons">
    <button class="buy" onclick="alert('Demo Buy Placed!')">BUY</button>
    <button class="sell" onclick="alert('Demo Sell Placed!')">SELL</button>
  </div>
  
  <a href="index.html">← Logout</a>
</body>
  </html>
