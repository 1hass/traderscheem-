<!DOCTYPE html>
<html>
<head>
<title>HassanFX - Trading</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background: #0a0a0a; color: white; font-family: Arial; margin:0; padding: 20px; }
.balance { background: #1a1a1a; padding: 20px; border-radius: 10px; text-align: center; margin-top:20px; }
.balance h1 { color: #00ff88; font-size: 40px; margin: 10px; }
.account-toggle {background:#1a1a1a; border-radius:20px; padding:5px 12px; display:flex; align-items:center; gap:8px; cursor:pointer; position:relative;}
.account-badge {background:#ff4444; color:#fff; font-size:10px; font-weight:bold; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.account-badge.real {background:#00c853;}
.account-dropdown {display:none; position:absolute; top:40px; left:0; background:#222; border-radius:10px; padding:8px 0; width:170px; z-index:9999; border:1px solid #333;}
.account-dropdown.active {display:block;}
.account-option {padding:10px 15px; display:flex; align-items:center; gap:8px; cursor:pointer; color:#fff; font-size:14px;}
.account-option:hover {background:#333;}
.dot {width:8px; height:8px; border-radius:50%;}
.dot.real {background:#00c853;}
.dot.demo {background:#ff4444;}
.modal { display:none; position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; color:white; padding:20px; border-radius:20px 20px 0 0; z-index:99999; border-top:1px solid #333;}
.pay-option { background:#2a2a2a; padding:15px; border-radius:12px; margin:10px 0; display:flex; align-items:center; cursor:pointer; }
.btn-green { width:100%; padding:15px; background:#00c853; border:none; color:white; border-radius:8px; font-weight:bold; font-size:16px; }
.trade-panel { background:#111; padding:15px; border-radius:12px; margin-top:15px; }
.stake-box { display:flex; align-items:center; background:#1a1a1a; border-radius:10px; padding:10px; margin:10px 0; }
.stake-box button { background:#333; border:none; color:white; width:40px; height:40px; font-size:20px; border-radius:8px; }
.stake-amount { flex:1; text-align:center; font-size:24px; font-weight:bold; color:#00ff88; }
.stake-buttons { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin:10px 0; }
.stake-btn { background:#1a1a1a; border:1px solid #333; color:white; padding:10px; border-radius:8px; cursor:pointer; }
.stake-btn.active { background:#00aaff; border-color:#00aaff; }
.risk-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin:10px 0; }
.risk-box { background:#1a1a1a; padding:10px; border-radius:8px; text-align:center; }
.risk-box small { color:#aaa; font-size:11px; }
.risk-box b { display:block; margin-top:5px; }
.buy { background: #00ff88; color: black; flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; }
.sell { background: #ff0044; color: white; flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; }
.trade-buttons { display:flex; gap:10px; margin-top:15px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:#0d0d0d; border-bottom:1px solid #1a1a1a;">
<div style="display:flex; align-items:center; gap:10px;">
<button style="background:#ff4444; border:none; color:white; width:35px; height:35px; border-radius:8px; font-weight:bold;">T</button>
<button style="background:#333; border:none; color:white; padding:5px 10px; border-radius:20px;">☰</button>
</div>
<div class="account-toggle" onclick="toggleDropdown()">
<span id="badge" class="account-badge">D</span>
<span id="topBalance" style="color:#ff4444; font-weight:bold;">$10,000.00</span>
<span>▼</span>
<div id="dropdown" class="account-dropdown">
<div class="account-option" onclick="switchAccount('demo')"><span class="dot demo"></span> Demo Account <span style="margin-left:auto; color:#ff4444; font-size:12px;" id="demoActive">Active</span></div>
<div class="account-option" onclick="switchAccount('real')"><span class="dot real"></span> Real Account <span style="margin-left:auto; color:#00c853; font-size:12px;" id="realActive"></span></div>
</div>
</div>
<div style="display:flex; align-items:center; gap:10px;">
<span style="font-size:20px;">🔊</span>
<button style="background:#00aaff; border:none; color:white; padding:8px 15px; border-radius:8px; font-weight:bold;" onclick="openDeposit()">Deposit</button>
<span style="font-size:20px;">🔔</span>
</div>
</div>

<h2>Welcome! Binary Trading</h2>
<div class="balance">
<p class="balance-title">Virtual Balance</p>
<h1 id="balanceDisplay">$10,000.00</h1>
<p id="profit">Profit: +$0.00</p>
</div>

<h3>EUR/USD Live Chart</h3>
<div id="tradingview_chart" style="margin:20px 0;"></div>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
"width": "100%", "height": 400, "symbol": "FX:EURUSD", "interval": "1",
"timezone": "Etc/UTC", "theme": "dark", "style": "1", "locale": "en",
"toolbar_bg": "#1a1a1a", "enable_publishing": false, "allow_symbol_change": true,
"container_id": "tradingview_chart"
});
</script>

<!-- TRADE PANEL -->
<div class="trade-panel">
<label style="color:#00aaff; font-size:12px;">STAKE</label>
<div class="stake-box">
<button onclick="changeStake(-1)">-</button>
<div class="stake-amount" id="stakeAmount">$10</div>
<button onclick="changeStake(1)">+</button>
</div>
<div class="stake-buttons">
<button class="stake-btn" onclick="setStake(1)">$1</button>
<button class="stake-btn" onclick="setStake(5)">$5</button>
<button class="stake-btn active" onclick="setStake(10)">$10</button>
<button class="stake-btn" onclick="setStake(25)">$25</button>
<button class="stake-btn" onclick="setStake(50)">$50</button>
<button class="stake-btn" onclick="setStake(100)">$100</button>
</div>
<div class="risk-grid">
<div class="risk-box"><small style="color:#00ff88;">TARGET PROFIT</small><b id="targetProfit">200</b></div>
<div class="risk-box"><small style="color:#ff0044;">STOP LOSS</small><b id="stopLoss">999</b></div>
<div class="risk-box"><small style="color:#ffaa00;">MULTIPLIER</small><b id="multiplier">x2</b></div>
</div>
<div class="trade-buttons">
<button class="buy" onclick="trade('buy')">BUY</button>
<button class="sell" onclick="trade('sell')">SELL</button>
</div>
</div>

<h3>Trade History</h3>
<div id="history" style="background:#1a1a1a; padding:15px; border-radius:10px; max-height:200px; overflow-y:auto; margin-bottom:20px;">
<p style="color:#888; text-align:center;">No trades yet</p>
</div>

<!-- DEPOSIT MODAL -->
<div id="depositModal" class="modal">
<div style="display:flex; justify-content:space-between;"><h3>Deposit Funds</h3><span onclick="closeModal('depositModal')">X</span></div>
<div class="pay-option" onclick="showMpesaForm()"><span style="font-size:24px; margin-right:10px;">📱</span><div><b>M-Pesa</b><br><small style="color:#aaa;">Instant mobile money</small></div></div>
</div>
<div id="mpesaForm" class="modal">
<div style="display:flex; justify-content:space-between;"><h3>M-Pesa Deposit</h3><span onclick="closeModal('mpesaForm')">X</span></div>
<input id="depPhone" placeholder="2547XXXXXXXX" style="width:100%; padding:12px; margin:5px 0; background:#333; border:none; color:white; border-radius:8px;">
<input id="depAmount" type="number" placeholder="Amount KES" style="width:100%; padding:12px; margin:5px 0; background:#333; border:none; color:white; border-radius:8px;">
<button onclick="doDeposit()" class="btn-green">Deposit Now</button>
</div>

<script>
let currentAccount = 'demo';
let demoBal = 10000.00;
let realBal = parseFloat(localStorage.getItem('realBalance')) || 0.00;
let stake = 10;
let profit = 0.00; let tradeCount = 1;
function toggleDropdown() { document.getElementById('dropdown').classList.toggle('active'); }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function openDeposit() { document.getElementById('depositModal').style.display = 'block'; }
function showMpesaForm() { closeModal('depositModal'); document.getElementById('mpesaForm').style.display = 'block'; }
function setStake(val) { stake = val; document.getElementById('stakeAmount').innerText = '$' + val; document.querySelectorAll('.stake-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); updateRisk(); }
function changeStake(dir) { stake = Math.max(1, stake + dir*5); document.getElementById('stakeAmount').innerText = '$' + stake; updateRisk(); }
function updateRisk() { document.getElementById('targetProfit').innerText = stake * 20; document.getElementById('stopLoss').innerText = stake * 99; document.getElementById('multiplier').innerText = 'x' + (stake >= 50 ? 5 : 2); }
function switchAccount(type) { currentAccount = type; document.getElementById('dropdown').classList.remove('active'); if(type === 'demo') { document.getElementById('badge').innerText = 'D'; document.getElementById('badge').className = 'account-badge'; document.getElementById('topBalance').innerText = '$' + demoBal.toLocaleString('en-US', {minimumFractionDigits: 2}); document.getElementById('topBalance').style.color = '#ff4444'; document.getElementById('demoActive').innerText = 'Active'; document.getElementById('realActive').innerText = ''; document.querySelector('.balance-title').innerText = 'Virtual Balance'; document.getElementById('balanceDisplay').innerText = '$' + demoBal.toLocaleString('en-US', {minimumFractionDigits: 2}); } else { document.getElementById('badge').innerText = 'R'; document.getElementById('badge').className = 'account-badge real'; document.getElementById('topBalance').innerText = '$' + realBal.toLocaleString('en-US', {minimumFractionDigits: 2}); document.getElementById('topBalance').style.color = '#00c853'; document.getElementById('realActive').innerText = 'Active'; document.getElementById('demoActive').innerText = ''; document.querySelector('.balance-title').innerText = 'Real Balance'; document.getElementById('balanceDisplay').innerText = '$' + realBal.toLocaleString('en-US', {minimumFractionDigits: 2}); } }
function trade(type) { let targetBal = currentAccount === 'demo' ? demoBal : realBal; if(targetBal < stake) return alert("Not enough balance!"); let win = Math.random() > 0.5; let pnl = win ? stake * 0.9 : -stake; profit = pnl; targetBal = targetBal + profit; if(currentAccount === 'demo') demoBal = targetBal; else { realBal = targetBal; localStorage.setItem('realBalance', realBal); } document.getElementById("balanceDisplay").innerHTML = "$" + targetBal.toFixed(2); document.getElementById("topBalance").innerHTML = "$" + targetBal.toFixed(2); document.getElementById("profit").innerHTML = "Profit: $" + profit.toFixed(2); let historyDiv = document.getElementById("history"); if(historyDiv.innerHTML.includes("No trades yet")) { historyDiv.innerHTML = ""; } let color = profit >= 0 ? "#00ff88" : "#ff0044"; let time = new Date().toLocaleTimeString(); let tradeText = `<p style="margin:5px 0; border-bottom:1px solid #333; padding-bottom:5px; font-size:14px;"><b>Trade #${tradeCount}</b> - ${type.toUpperCase()} $${stake} - ${time} <span style="color:${color}; float:right;">$${profit.toFixed(2)}</span> </p>`; historyDiv.innerHTML = tradeText + historyDiv.innerHTML; tradeCount++; }
async function doDeposit() { const phone = document.getElementById('depPhone').value; const amount = document.getElementById('depAmount').value; if(!phone || !amount) return alert("Enter phone and amount"); alert("Sending STK Push to " + phone + "..."); closeModal('mpesaForm'); const res = await fetch('https://traderscheem-backend-9p9o.onrender.com/stkpush', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount: amount, phone: phone }) }); const data = await res.json(); if(data.ResponseCode === "0") { alert("STK Sent! Check your phone"); setTimeout(loadRealBalance, 10000); } else { alert("Error: " + data.ResponseDescription); } }
async function loadRealBalance() { const phone = prompt("Enter your phone to check balance:"); if(!phone) return; const res = await fetch(`https://traderscheem-backend-9p9o.onrender.com/balance/${phone}`); const data = await res.json(); realBal = data.balance || 0; localStorage.setItem('realBalance', realBal); if(currentAccount === 'real') switchAccount('real'); }
window.onclick = function(e) { if(!e.target.closest('.account-toggle')) { document.getElementById('dropdown').classList.remove('active'); } }
</script>
<a href="index.html">← Logout</a>
</body>
</html>
