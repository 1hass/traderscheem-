<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HassanFX Admin Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#101820;
color:white;
}
    .top-nav, .header-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 2px;
        width: 100%;
        box-sizing: border-box;
    }
    button, .deposit-btn, .account-toggle, .notif-btn {
        padding: 4px 6px !important;
        font-size: 10px !important;
        min-height: unset !important;
        max-width: none !important;
    }
    
.header{
background:#00c853;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:#1f2d3d;
padding:20px;
margin-bottom:15px;
border-radius:10px;
text-align:center;
}

.card h2{
margin:0;
font-size:20px;
}

.card p{
font-size:28px;
color:#00ff88;
font-weight:bold;
margin-top:10px;
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.menu a{
background:#222;
color:white;
text-decoration:none;
padding:15px;
border-radius:10px;
text-align:center;
font-weight:bold;
}

.menu a:hover{
background:#00aaff;
}
</style>
</head>

<body>

<div class="header">
HassanFX Admin Dashboard
</div>

<div class="container">

<div class="card">
<h2>👥 Total Users</h2>
<p>0</p>
</div>

<div class="card">
<h2>💰 Total Deposits</h2>
<p>$0.00</p>
</div>

<div class="card">
<h2>🏦 Total Withdrawals</h2>
<p>$0.00</p>
</div>

<div class="card">
<h2>📈 Total Trades</h2>
<p>0</p>
</div>

<div class="menu">
<a href="users.html">👥 Users</a>
<a href="deposits.html">💰 Deposits</a>
<a href="withdrawals.html">🏦 Withdrawals</a>
<a href="trades.html">📈 Trades</a>
<a href="settings.html">⚙️ Settings</a>
<a href="../index.html">🚪 Logout</a>
</div>

</div>

</html>
