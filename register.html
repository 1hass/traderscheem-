<!DOCTYPE html>
<html>
<head>
  <title>Create Account - HassanFX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #0a0a0a; color: white; font-family: Arial; text-align: center; padding: 50px 10px; }
    .box { background: #1a1a1a; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; }
    input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
    button { background: #007bff; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; width: 90%; font-weight: bold; }
    button:disabled { background: #555; cursor: not-allowed; }
    a { color: #00ff88; text-decoration: none; }
    #msg { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Create Demo Account</h2>
    <p>Start with $10,000 Virtual Money</p>
    
    <form id="registerForm">
      <input type="text" id="fullname" placeholder="Full Name" required><br>
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit" id="submitBtn">Create Account</button>
    </form>
    
    <div id="msg"></div><br>
    <a href="index.html">← Back to Home</a>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      
      submitBtn.disabled = true;
      msg.style.color = '#00ff88';
      msg.textContent = 'Creating account...';

      const fullName = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('https://traderscheem-backend-9p9o.onrender.com/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Save user session details
          if (data.user) {
            localStorage.setItem('user', JSON.stringify(data.user));
          } else {
            localStorage.setItem('user', JSON.stringify({ fullName, email }));
          }

          msg.textContent = 'Success! Redirecting to dashboard...';
          
          // Automatically redirect to your trading page
          setTimeout(() => {
            window.location.href = 'trade.html'; // Change to dashboard.html if needed
          }, 1000);
        } else {
          msg.style.color = '#ff4444';
          msg.textContent = data.message || 'Registration failed. Try again.';
          submitBtn.disabled = false;
        }
      } catch (err) {
        msg.style.color = '#ff4444';
        msg.textContent = 'Server error. Please try again later.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
