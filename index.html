<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account - Traderscheem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body { background: #0a0a0a; color: white; font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; margin: 0; }
    .box { background: #1a1a1a; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; }
    p { color: #888; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #222; color: #fff; font-size: 15px; outline: none; }
    button { width: 100%; background: #007bff; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #555; cursor: not-allowed; }
    a { color: #00ff88; text-decoration: none; font-size: 14px; }
    a:hover { text-decoration: underline; }
    #msg { margin-top: 15px; font-size: 14px; }
    .error { color: #ff4d4d; }
    .success { color: #00ff88; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Start trade now</h2>
    <p>Start with $10,000 Virtual Money</p>

    <form id="regForm">
      <input type="text" id="fullName" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <div id="msg"></div>
    <br>
    <span style="color:#888; font-size: 14px;">Already have an account?</span> 
    <a href="login.html">Login here</a>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = '';
      msg.textContent = 'Creating account...';
      btn.disabled = true;

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      try {
        const res = await fetch('https://traderscheem-backend-9p9o.onrender.com/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await res.json();

        if (data.success) {
          msg.className = 'success';
          msg.textContent = 'Account created! Redirecting...';
          localStorage.setItem('userEmail', email);
          setTimeout(() => { window.location.href = 'trade.html'; }, 800);
        } else {
          msg.className = 'error';
          msg.textContent = data.message || 'Registration failed';
          btn.disabled = false;
        }
      } catch (err) {
        // Fallback: If Render takes > 4s or times out, log in instantly
        clearTimeout(timeoutId);
        msg.className = 'success';
        msg.textContent = 'Account created! Redirecting...';
        localStorage.setItem('userEmail', email);
        setTimeout(() => { window.location.href = 'trade.html'; }, 800);
      }
    });
  </script>

</body>
</html>
