<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - TraderScheem</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f1115; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1a1d24; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
    h2 { margin-top: 0; font-size: 24px; }
    p { color: #8a8f9d; font-size: 14px; margin-bottom: 24px; }
    input { width: 100%; padding: 12px 16px; margin-bottom: 16px; background: #252932; border: 1px solid #333846; border-radius: 6px; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #007bff; }
    button { width: 100%; padding: 12px; background: #007bff; border: none; border-radius: 6px; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0056b3; }
    #msg { margin-top: 15px; font-size: 14px; }
    .error { color: #ff4d4d; }
    .success { color: #28a745; }
  </style>
</head>
<body>

<div class="card">
  <h2>Create Demo Account</h2>
  <p>Start with $10,000 Virtual Money</p>

  <form id="regForm">
    <input type="text" id="fullName" placeholder="Full Name" required />
    <input type="email" id="email" placeholder="Email Address" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit" id="submitBtn">Create Account</button>
  </form>

  <div id="msg"></div>
</div>

<script>
  const form = document.getElementById('regForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = '';
    msg.textContent = 'Connecting to server...';
    btn.disabled = true;

    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    try {
      const res = await fetch('https://traderscheem-backend-9p9o.onrender.com/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName, email, password })
      });

      const data = await res.json();

      if (res.ok && data.success) {
        msg.className = 'success';
        msg.textContent = 'Account created! Redirecting...';
        localStorage.setItem('userEmail', email);
        setTimeout(() => {
          window.location.href = 'trade.html';
        }, 1000);
      } else {
        msg.className = 'error';
        msg.textContent = data.message || 'Error creating account';
        btn.disabled = false;
      }
    } catch (err) {
      msg.className = 'error';
      msg.textContent = 'Server connecting... Please tap again in 10 seconds.';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
