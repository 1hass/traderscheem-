<!DOCTYPE html>
<html>
<head>
  <title>TraderScheem - Buy & Sell in Kenya</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f5f5f5; }
    .header { background: #ff6600; padding: 15px; color: white; text-align: center; }
    .search-box { padding: 40px 20px; text-align: center; background: white; }
    .search-box input { width: 70%; padding: 15px; font-size: 16px; border: 2px solid #ff6600; border-radius: 8px 0 0 8px; }
    .search-box button { padding: 15px 25px; background: #ff6600; color: white; border: none; border-radius: 0 8px 8px 0; font-size: 16px; }
    .categories { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; gap: 15px; }
    .cat { background: white; padding: 20px; border-radius: 8px; width: 150px; text-align: center; box-shadow: 0 2px 5px #ccc; }
  </style>
</head>
<body>
  <div class="header">
    <h1>TraderScheem</h1>
  </div>
  
  <div class="search-box">
    <h2>What are you looking for?</h2>
    <input type="text" placeholder="Search for phones, cars, jobs...">
    <button>Search</button>
  </div>
  
  <div class="categories">
    <div class="cat">📱 Phones</div>
    <div class="cat">🚗 Cars</div>
    <div class="cat">🏠 Property</div>
    <div class="cat">💼 Jobs</div>
    <div class="cat">👕 Fashion</div>
    <div class="cat">🛋️ Furniture</div>
  </div>
</body>
</html>
