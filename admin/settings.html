<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - HassanFX Admin</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#101820;
color:white;
}

.header{
background:#673ab7;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:20px;
}

.box{
background:#1f2d3d;
padding:20px;
border-radius:10px;
margin-bottom:15px;
}

label{
display:block;
margin-bottom:8px;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:6px;
background:#222;
color:white;
box-sizing:border-box;
}

button{
margin-top:15px;
padding:12px;
width:100%;
background:#00c853;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.back{
display:block;
margin-bottom:20px;
color:#00ff88;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
⚙️ Admin Settings
</div>

<div class="container">

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>

<div class="box">
<label>Platform Name</label>
<input type="text" value="HassanFX">
</div>

<div class="box">
<label>Support Email</label>
<input type="email" value="support@hassanfx.com">
</div>

<div class="box">
<label>Minimum Deposit (USD)</label>
<input type="number" value="10">
</div>

<button>Save Settings</button>

</div>

</body>
</html>
