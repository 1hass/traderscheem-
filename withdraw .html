<!DOCTYPE html>
<html>
<head>
<title>Withdraw - HassanFX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background: #0a0a0a; color: white; font-family: Arial; padding: 20px; }
.box { background: #1a1a1a; padding: 20px; border-radius: 12px; max-width: 400px; margin: 50px auto; }
input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: none; color: white; border-radius: 8px; }
.btn { width: 100%; padding: 15px; background: #ff4444; border: none; color: white; border-radius: 8px; font-weight: bold; font-size: 16px; }
.back { color: #00aaff; text-decoration: none; }
</style>
</head>
<body>
<a href="trade.html" class="back">← Back to Trade</a>
<div class="box">
<h2>💸 Withdraw Funds</h2>
<p>Balance: <b id="bal">$0.00</b></p>
<input id="wPhone" placeholder="M-Pesa Number: 2547XXXXXXXX">
<input id="wAmount" type="number" placeholder="Amount $">
<button onclick="withdraw()" class="btn">Withdraw Now</button>
<p id="msg" style="color:#aaa; margin-top:10px;"></p>
</div>

<script>
let realBal = parseFloat(localStorage.getItem('realBalance')) || 0.00;
document.getElementById('bal').innerText = '$' + realBal.toFixed(2);

function withdraw() {
const phone = document.getElementById('wPhone').value;
const amount = parseFloat(document.getElementById('wAmount').value);
if(!phone || !amount) return alert("Enter phone and amount");
if(amount > realBal) return alert("Not enough balance!");
if(amount < 10) return alert("Minimum withdraw $10");

realBal = realBal - amount;
localStorage.setItem('realBalance', realBal);
document.getElementById('bal').innerText = '$' + realBal.toFixed(2);
document.getElementById('msg').innerText = "Withdrawal request sent! Money will arrive in 5-10 minutes.";

// TODO: Connect to your backend to send real M-Pesa B2C
alert("Withdraw $"+amount+" to "+phone+" requested!");
}
</script>
</body>
</html>
